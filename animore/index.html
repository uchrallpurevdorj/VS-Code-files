<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <title>Animore</title>
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Animore moved to animore.studio. Carry the saved list and settings over once (auth token is NOT sent: sign in again, the list syncs back).
    (function () {
      var h = location.hash, q = location.search, data = {};
      try {
        Object.keys(localStorage).forEach(function (k) {
          var n = k.indexOf('anidex:v1:') === 0 ? 'animore:v1:' + k.slice(10) : k;      // very old Anidex data -> Animore keys
          if (n.indexOf('animore:v1:') !== 0 || /:(auth|c:|tr:)/.test(n)) return;
          if (!(n in data) || n === k) data[n] = localStorage.getItem(k);
        });
      } catch (e) {}
      var url = 'https://animore.studio/' + q;
      if (/^#access_token=/.test(h)) url += '';           // a sign-in that finished here cannot be completed on the new address
      else if (Object.keys(data).length) url += '#migrate=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data)))));
      else url += h;
      location.replace(url);
    })();
  </script>
  <meta http-equiv="refresh" content="2; url=https://animore.studio/">
</head>
<body style="background:#141414;color:#f5f5f5;font-family:system-ui,sans-serif;padding:24px">
  <p>Animore moved to <a href="https://animore.studio/" style="color:#ff5a5a">animore.studio</a>.</p>
</body>
</html>
